# Tunable, non-secret parameters. One place to change, every experiment reproducible.
models:
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  visual_retriever: vidore/colqwen2-v1.0
  llm_default: claude-sonnet-4-5       # answer generation, verification
  llm_small: claude-haiku-4-5          # routing, grading

chunking:
  max_tokens: 512
  overlap_tokens: 64
  keep_tables_separate: true

retrieval:
  top_k_dense: 30
  top_k_sparse: 30
  rrf_k: 60
  rerank_top_n: 8

agent:
  max_iterations: 3
  grader_threshold: 0.6

qdrant:
  text_collection: finsight_text
  visual_collection: finsight_pages